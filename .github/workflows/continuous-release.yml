name: Build APK

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  release-apk:
    name: armeabi-v7a release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Decode release keystore when secrets are configured
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_FILE_BASE64" ]; then
            echo -n "$KEYSTORE_FILE_BASE64" | base64 -d > android/app/upload-keystore.jks
          else
            echo "No release keystore secret; the APK will be signed with the debug key."
          fi

      - name: Ensure the debug keystore exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build armeabi-v7a release APK
        env:
          FLAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.FLAUNCHER_KEYSTORE_PASSWORD }}
          FLAUNCHER_SIGNING_KEY_ALIAS: ${{ secrets.FLAUNCHER_SIGNING_KEY_ALIAS }}
          FLAUNCHER_SIGNING_KEY_PASSWORD: ${{ secrets.FLAUNCHER_SIGNING_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm

      - name: Collect APK
        run: |
          mkdir -p dist
          apk="$(find build/app/outputs/flutter-apk -name '*armeabi-v7a*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            apk="$(find build/app/outputs/flutter-apk -name '*.apk' -print -quit)"
          fi
          test -n "$apk"
          cp "$apk" dist/flauncher-armeabi-v7a-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flauncher-armeabi-v7a-release
          path: dist/flauncher-armeabi-v7a-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/flauncher-armeabi-v7a-release.apk
          fail_on_unmatched_files: true
