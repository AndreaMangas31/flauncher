plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePassword = System.getenv("FLAUNCHER_KEYSTORE_PASSWORD")
def keyAlias = System.getenv("FLAUNCHER_SIGNING_KEY_ALIAS")
def keyPassword = System.getenv("FLAUNCHER_SIGNING_KEY_PASSWORD")
def keystoreFile = file("upload-keystore.jks")
def hasReleaseKeystore = keystoreFile.exists() &&
        keystorePassword != null && !keystorePassword.isEmpty() &&
        keyAlias != null && !keyAlias.isEmpty() &&
        keyPassword != null && !keyPassword.isEmpty()

android {
    defaultConfig {
        applicationId "me.efesser.flauncher"
        compileSdk 35
        minSdk 21
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        debug {}
        release {
            if (hasReleaseKeystore) {
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // This fork often has no upload keystore. The debug key still produces
            // an APK that adb can install. It cannot update a build signed with another key.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    splits {
        abi {
            // https://stackoverflow.com/a/39950584/21037183
            enable gradle.startParameter.taskNames.any { it.contains("assembleRelease") }
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'me.efesser.flauncher'
}

flutter {
    source '../..'
}
